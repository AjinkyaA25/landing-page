<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080D19"/>
      <stop offset="46%" stop-color="#0E1A30"/>
      <stop offset="78%" stop-color="#1B2947"/>
      <stop offset="100%" stop-color="#28305A"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F6E3B4" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#E8C77E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8C77E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E3A83B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E3A83B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E3A83B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ridge2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C1662B" stop-opacity="0"/>
      <stop offset="55%" stop-color="#C1662B" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#C1662B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#sky)"/>

  <circle cx="1220" cy="150" r="130" fill="url(#moon)"/>
  <circle cx="1220" cy="150" r="46" fill="#F6E9C6"/>

  <g fill="#F2E9D0">
    <circle cx="120" cy="90" r="1.6" opacity="0.8"/>
    <circle cx="220" cy="160" r="1.1" opacity="0.6"/>
    <circle cx="340" cy="70" r="1.4" opacity="0.7"/>
    <circle cx="430" cy="200" r="1.1" opacity="0.5"/>
    <circle cx="520" cy="110" r="1.6" opacity="0.75"/>
    <circle cx="610" cy="60" r="1.1" opacity="0.55"/>
    <circle cx="720" cy="180" r="1.3" opacity="0.6"/>
    <circle cx="800" cy="90" r="1.5" opacity="0.7"/>
    <circle cx="900" cy="150" r="1.1" opacity="0.5"/>
    <circle cx="980" cy="60" r="1.4" opacity="0.65"/>
    <circle cx="1050" cy="230" r="1.1" opacity="0.5"/>
    <circle cx="1400" cy="100" r="1.5" opacity="0.7"/>
    <circle cx="1480" cy="200" r="1.1" opacity="0.55"/>
    <circle cx="1550" cy="120" r="1.3" opacity="0.6"/>
    <circle cx="60" cy="240" r="1.1" opacity="0.5"/>
    <circle cx="1330" cy="260" r="1.1" opacity="0.5"/>
  </g>

  <!-- far dune -->
  <path d="M0,560 C220,500 380,540 560,510 C760,478 900,520 1100,495 C1300,470 1450,505 1600,480 L1600,900 L0,900 Z" fill="#141F38"/>
  <path d="M0,560 C220,500 380,540 560,510 C760,478 900,520 1100,495 C1300,470 1450,505 1600,480" fill="none" stroke="url(#ridge2)" stroke-width="4"/>

  <!-- mid dune -->
  <path d="M0,660 C260,600 420,650 620,615 C820,580 980,630 1180,605 C1350,585 1480,615 1600,600 L1600,900 L0,900 Z" fill="#101830"/>
  <path d="M0,660 C260,600 420,650 620,615 C820,580 980,630 1180,605 C1350,585 1480,615 1600,600" fill="none" stroke="url(#ridge1)" stroke-width="5"/>

  <!-- near dune -->
  <path d="M0,760 C240,710 460,755 680,725 C900,695 1080,740 1300,715 C1420,700 1520,720 1600,705 L1600,900 L0,900 Z" fill="#0A1122"/>
  <path d="M0,760 C240,710 460,755 680,725 C900,695 1080,740 1300,715 C1420,700 1520,720 1600,705" fill="none" stroke="url(#ridge1)" stroke-width="6"/>
</svg>
